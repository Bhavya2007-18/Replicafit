<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness Coach - Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        .video-container {
            margin-top: 1.5rem;
            border-radius: 8px;
            overflow: hidden;
            border: 4px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            width: 640px;
            height: 480px;
            background: #000;
        }
        img#video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 1rem;
            padding: 1rem;
            background: #334155;
            border-radius: 8px;
        }
        .stat-box h3 { margin: 0; color: #94a3b8; font-size: 0.9rem;}
        .stat-box p { margin: 0; font-size: 1.5rem; font-weight: bold; color: #38bdf8;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Squat Coach AI</h1>
        <p>Ensure your full body is visible in the camera frame.</p>
        
        <div class="video-container">
            <img id="video-feed" src="http://localhost:5000/video_feed" alt="Video Feed Loading..." onerror="this.onerror=null; this.alt='Backend Offline. Start app.py first!';"/>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <h3>Reps</h3>
                <p id="rep-count">0</p>
            </div>
            <div class="stat-box">
                <h3>Feedback</h3>
                <p id="feedback-text">Ready</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
